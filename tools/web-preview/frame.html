<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小程序原始页面</title><style id="app-style"></style><style id="page-style"></style><style>
html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer}input,textarea{outline:none}textarea{display:block;resize:none;line-height:1.6}img{object-fit:cover}#toast{position:fixed;z-index:10000;max-width:85%;left:50%;top:42%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;background:#15243def;color:white;font-size:14px;text-align:center;pointer-events:none}#toast:empty{display:none}.preview-nav{position:fixed;z-index:50;top:0;left:0;right:0;background:#ffffffef;height:64px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;border-bottom:1px solid #e4e9f0}.preview-nav button{position:absolute;left:12px;background:none;border:0;font-size:24px}.preview-login{padding:100px 24px}.preview-login button{display:block;width:100%;padding:16px;background:#2563eb;color:white;border:0;border-radius:12px;margin:16px 0}select.field-input{width:100%;height:44px}.preview-modal{position:fixed;inset:0;z-index:200;background:#13203788;display:flex;align-items:center;justify-content:center;padding:24px}.preview-dialog{background:white;padding:22px;border-radius:16px;width:100%;font-size:15px}.preview-dialog h3{margin-top:0}.preview-dialog button{padding:9px 18px;margin:12px 8px 0 0}.preview-dialog img{width:100%}[role=button]{cursor:pointer}.sup-input{padding-bottom:max(14px,env(safe-area-inset-bottom))!important}
</style></head><body><main id="mp-root"></main><div id="toast" role="status"></div><div id="overlay"></div><script src="/runtime.js"></script></body></html>
